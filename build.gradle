plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository { mavenCentral() }
        filter {
            includeGroupByRegex "org\\.junit.*"
            includeGroup "org.opentest4j"
            includeGroup "org.apiguardian"
        }
    }
    maven {
        name = "Masa"
        url = "https://masa.dy.fi/maven/sakura-ryoko"
        content {
            includeGroupAndSubgroups("fi.dy.masa")
        }
    }
    maven {
        name = "FallenBreath"
        url = "https://maven.fallenbreath.me/releases"
        content {
            includeGroup("me.fallenbreath")
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "voxelweave" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

def withLitematica = providers.gradleProperty("withLitematica")
        .map { it.toBoolean() }
        .getOrElse(false)

dependencies {
    testImplementation "org.junit.jupiter:junit-jupiter:5.12.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.12.2"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Compile against the audited integration versions without bundling either mod.
    compileOnly "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}"
    compileOnly "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"

    // Opt in when launching a development client that should contain Litematica.
    if (withLitematica) {
        runtimeOnly "fi.dy.masa.litematica:litematica-fabric-${project.minecraft_version}:${project.litematica_version}"
        runtimeOnly "fi.dy.masa.malilib:malilib-fabric-${project.minecraft_version}:${project.malilib_version}"
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

test {
    useJUnitPlatform()
}
